databaseChangeLog:
  - changeSet:
      id: 012-insert-category-data
      author: akira
      changes:
        - loadData:
            tableName: category
            file: db/data/012-category.csv
            separator: ","
            columns:
              - column:
                  name: name
                  type: STRING
              - column:
                  name: description
                  type: STRING
              - column:
                  name: image
                  type: STRING
              - column:
                  name: created_at
                  type: DATE