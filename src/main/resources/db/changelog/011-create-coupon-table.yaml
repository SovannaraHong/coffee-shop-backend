databaseChangeLog:
  - changeSet:
      id: 011
      author: akira
      changes:
        - createTable:
            tableName: coupon
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: discount_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: discount_value
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: min_order
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: start_date
                  type: DATE
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: status
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
