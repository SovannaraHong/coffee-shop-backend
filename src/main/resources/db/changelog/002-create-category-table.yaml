databaseChangeLog:
  - changeSet:
      id: 002
      author: akira
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column: # ADD THIS
                  name: updated_at
                  type: TIMESTAMP

