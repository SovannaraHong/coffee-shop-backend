databaseChangeLog:
  - changeSet:
      id: 003
      author: akira
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount
                  type: NUMERIC(5,2)
                  defaultValueNumeric: 0
              - column:
                  name: stock
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: image
                  type: VARCHAR(255)
              - column:
                  name: PRODUCT_SIZE
                  #                  oldColumnName: size
                  #                  newColumnName: product_size
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: featured
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_category
                    references: category(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column: # ADD THIS
                  name: updated_at
                  type: TIMESTAMP

