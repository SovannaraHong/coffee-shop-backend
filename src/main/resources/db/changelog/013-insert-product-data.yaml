databaseChangeLog:
  - changeSet:
      id: 013
      author: Sovannara
      changes:
        - loadData:
            tableName: product
            file: db/data/013-product.csv
            separator: ","
            columns:
              - column:
                  name: NAME
                  type: STRING

              - column:
                  name: DESCRIPTION
                  type: STRING

              - column:
                  name: PRICE
                  type: NUMERIC

              - column:
                  name: DISCOUNT
                  type: NUMERIC

              - column:
                  name: STOCK
                  type: NUMERIC

              - column:
                  name: IMAGE
                  type: STRING

              - column:
                  name: PRODUCT_SIZE
                  type: STRING

              - column:
                  name: CATEGORY_ID
                  type: NUMERIC

              - column:
                  name: STATUS
                  type: BOOLEAN
              - column:
                  name: CREATED_AT
                  type: DATETIME
