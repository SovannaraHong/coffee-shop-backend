databaseChangeLog:
  - changeSet:
      id: 001
      author: akira
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: provider
                  type: VARCHAR(20)
                  defaultValue: LOCAL
                  constraints:
                    nullable: false
              - column:
                  name: provider_id
                  type: VARCHAR(255)
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: CUSTOMER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
