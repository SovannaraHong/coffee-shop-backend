databaseChangeLog:
  - changeSet:
      id: 008
      author: akira
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_order
                    references: orders(id)
              - column:
                  name: method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: transaction_id
                  type: VARCHAR(255)
              - column:
                  name: paid_at
                  type: TIMESTAMP
