databaseChangeLog:
  - changeSet:
      id: 006
      author: akira
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_user
                    references: users(id)
              - column:
                  name: order_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: subtotal
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: delivery_fee
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: total
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: TEXT
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column: # ADD THIS
                  name: updated_at
                  type: TIMESTAMP
