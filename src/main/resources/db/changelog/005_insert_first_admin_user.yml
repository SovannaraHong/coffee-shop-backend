databaseChangeLog:

  - changeSet:
      id: 005_insert_first_admin_user
      author: sovannaraHong@gmail.com
      validCheckSum: ANY

      changes:

        - loadData:
            tableName: app_user
            file: data/005_users.csv
            relativeToChangelogFile: true
            separator: ","
            encoding: UTF-8
            columns:
              - column:
                  header: id
                  name: id
                  type: NUMERIC
              - column:
                  header: full_name
                  name: full_name
                  type: STRING
              - column:
                  header: email
                  name: email
                  type: STRING
              - column:
                  header: password_hash
                  name: password_hash
                  type: STRING
              - column:
                  header: role_id
                  name: role_id
                  type: NUMERIC
              - column:
                  header: is_active
                  name: is_active
                  type: BOOLEAN
              - column:
                  header: failed_login_attempts
                  name: failed_login_attempts
                  type: NUMERIC
              - column:
                  header: created_at
                  name: created_at
                  type: DATETIME
              - column:
                  header: created_by
                  name: created_by
                  type: NUMERIC
              - column:
                  header: updated_by
                  name: updated_by
                  type: NUMERIC

        - sql:
            splitStatements: false
            sql: >
              UPDATE app_user
              SET role_id = (SELECT id FROM role WHERE name = 'ADMIN')
              WHERE id IN (1, 2)

      rollback:
        - sql:
            sql: |
              DELETE FROM app_user
              WHERE id IN (1, 2);

