spring:
  application:
    name: coffee-shop


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  devtools:
    restart:
      enabled: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

aws:
  access-key: ${AWS_ACCESS_KEY_ID_COFFEE}
  secret-key: ${AWS_SECRET_ACCESS_KEY_COFFEE}
  region: ${AWS_REGION_COFFEE}
  bucket-name: ${AWS_BUCKET_NAME_COFFEE}

cutluy:
  api:
    key: ${CUTLUY_API_KEY}
  base-url: https://cutluy.com/v1

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/myrealm}

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:myrealm}
  admin-client-id: coffee-backend
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  # ADDED (2026-10-08): frontend client used for verifyPassword() — must have "Direct Access Grants" ON in Keycloak
  # Go to Keycloak → Clients → admin-web → Settings → Direct Access Grants → Enabled
  user-client-id: ${KEYCLOAK_USER_CLIENT_ID:admin-web}


  customer-login-client-id: customer-login
  customer-login-client-secret: ${KEYCLOAK_CUSTOMER_LOGIN_SECRET}


  staff-login-client-id: staff-login
  staff-login-client-secret: ${KEYCLOAK_STAFF_LOGIN_SECRET}


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
